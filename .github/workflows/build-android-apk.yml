name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Build Standalone Android APK (Full + Client Demo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix || true
          find node_modules -name "libs.versions.toml" -exec sed -i "s/1\.9\.24/1.9.25/g" {} + || true

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --no-install
          echo "" >> android/gradle.properties
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties
          sed -i "s/1\.9\.24/1.9.25/g" android/build.gradle || true

      - name: Build Full Unlocked Owner APK (Stock-QR-Inventory.apk)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.kotlinVersion=1.9.25 -x lint -x test --no-daemon

      - name: Save Full Unlocked APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./Stock-QR-Inventory.apk
          ls -lh ./Stock-QR-Inventory.apk

      - name: Build Blocked Client Demo APK (Stock-QR-Client-Demo-Locked.apk)
        run: |
          sed -i "s/DEFAULT_CLIENT_DEMO_LOCKED = false/DEFAULT_CLIENT_DEMO_LOCKED = true/g" src/context/InventoryContext.tsx
          sed -i "s/Stock & QR Inventory/Mobile Store (Client Demo)/g" android/app/src/main/res/values/strings.xml || true
          cd android
          ./gradlew assembleRelease -Pandroid.kotlinVersion=1.9.25 -x lint -x test --no-daemon
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk ./Stock-QR-Client-Demo-Locked.apk
          ls -lh ./Stock-QR-Client-Demo-Locked.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Stock-QR-Inventory-APKs
          path: |
            ./Stock-QR-Inventory.apk
            ./Stock-QR-Client-Demo-Locked.apk

      - name: Publish Direct APK Downloads to GitHub Releases (v1.0.0 & v2.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Mobile Store QR Inventory v2.0.0 (Full Owner APK + Blocked Client Demo APK)"
          body: |
            ## 📱 1. Full Unlocked Owner Android APK (Mobile Phone Store Edition + Online Updates)
            Tap **`Stock-QR-Inventory.apk`** below to install the full unlocked app with Mobile Store inventory, Designer QR Studio, Profit Dashboard, and Online Update Checker.

            ## 🔒 2. Blocked Client Demo Android APK (Send This to Your Client)
            Tap or share **`Stock-QR-Client-Demo-Locked.apk`** to show a client how the app works **without** giving them full access (watermarked, 3-scan demo limit, adding/printing/exporting locked).
          files: |
            ./Stock-QR-Inventory.apk
            ./Stock-QR-Client-Demo-Locked.apk
            ./docs/client-demo.html
            ./dist/Stock-QR-Inventory-Android.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
