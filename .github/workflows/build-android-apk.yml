name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build Standalone Release APK (Self-Contained JS Bundle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon

      - name: Rename APK for Direct Phone Download
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./Stock-QR-Inventory.apk
          ls -lh ./Stock-QR-Inventory.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stock-QR-Inventory-APK
          path: ./Stock-QR-Inventory.apk

      - name: Publish Direct APK Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Stock & QR Inventory Studio v1.0.0 (Android APK)"
          body: |
            ## 📱 Direct Android APK Download
            Tap **`Stock-QR-Inventory.apk`** below on your Android phone to download and install the native Android app directly!
          files: |
            ./Stock-QR-Inventory.apk
            ./dist/Stock-QR-Inventory-Android.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
