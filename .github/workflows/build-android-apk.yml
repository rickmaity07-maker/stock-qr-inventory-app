name: Build & Release Android APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build APKs (full + client demo)
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Never ship a build that fails its checks
      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Generate native Android project
        run: |
          npx expo prebuild --platform android --no-install
          find node_modules -name "libs.versions.toml" -exec sed -i "s/1\.9\.24/1.9.25/g" {} + || true
          echo "" >> android/gradle.properties
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties
          sed -i "s/1\.9\.24/1.9.25/g" android/build.gradle || true
          node scripts/configure-signing.mjs

      - name: Build full APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.kotlinVersion=1.9.25 -x lint -x test --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Stock-QR-Inventory.apk

      - name: Build client demo APK (locked preview)
        run: |
          sed -i "s/DEFAULT_CLIENT_DEMO_LOCKED = false/DEFAULT_CLIENT_DEMO_LOCKED = true/" src/context/InventoryContext.tsx
          grep -q "DEFAULT_CLIENT_DEMO_LOCKED = true" src/context/InventoryContext.tsx
          sed -i "s/Stock &amp; QR Inventory/Stock QR (Client Demo)/g; s/Stock & QR Inventory/Stock QR (Client Demo)/g" android/app/src/main/res/values/strings.xml || true
          cd android
          ./gradlew assembleRelease -Pandroid.kotlinVersion=1.9.25 -x lint -x test --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Stock-QR-Client-Demo-Locked.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stock-QR-Inventory-APKs-v${{ steps.version.outputs.version }}
          path: |
            Stock-QR-Inventory.apk
            Stock-QR-Client-Demo-Locked.apk

      # One release per app version. "releases/latest/download/<file>" always points at the newest,
      # which is what the in-app updater (docs/live-update.json) uses.
      - name: Publish GitHub release v${{ steps.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stock QR v${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            **Stock-QR-Inventory.apk** — the full app. Install over the previous version; your data stays.
            **Stock-QR-Client-Demo-Locked.apk** — locked preview for showing clients (3 demo scans, editing/printing/export locked).

            iPhone: open https://rickmaity07-maker.github.io/stock-qr-inventory-app/app/ in Safari → Share → Add to Home Screen.
          files: |
            Stock-QR-Inventory.apk
            Stock-QR-Client-Demo-Locked.apk
