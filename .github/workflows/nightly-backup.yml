name: Nightly cloud backup

# Every night: check the API is up, then save an encrypted copy of all cloud data.
# GitHub emails the repo owner if this fails. Copies are kept 90 days
# (Actions → Nightly cloud backup → a run → Artifacts). To restore, see server/README.md.
on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: API is up
        run: curl -fsS --retry 3 --retry-delay 10 https://stock-qr-api.vercel.app/api/health

      - name: Install
        working-directory: server
        run: npm ci

      - name: Export and encrypt
        id: backup
        working-directory: server
        run: |
          name="StockQR-cloud-backup-$(date -u +%Y-%m-%d)"
          npm run backup -- "../$name.sqrb"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.name }}
          path: ${{ steps.backup.outputs.name }}.sqrb
          retention-days: 90
          if-no-files-found: error
