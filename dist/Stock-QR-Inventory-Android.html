<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090E1A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mobile QR" />
  <title>Mobile Store QR Studio (iPhone & Android)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #F4F7FB;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
    }
    header {
      background: linear-gradient(180deg, #090E1A 0%, #0F172A 100%);
      color: #FFF;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #14B8A6, #0F766E);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px; color: #FFF;
    }
    .header-title { font-size: 16px; font-weight: 800; }
    .header-badges { display: flex; gap: 6px; align-items: center; }
    .badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 99px; }
    .badge-sync { background: rgba(16, 185, 129, 0.18); color: #34D399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-owner { background: linear-gradient(135deg, #0D9488, #0F766E); color: #FFF; }
    .badge-staff { background: linear-gradient(135deg, #2563EB, #1D4ED8); color: #FFF; }

    .ios-install-banner {
      background: linear-gradient(90deg, #0F172A, #1E293B);
      color: #F8FAFC;
      padding: 8px 14px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
    }
    .ios-install-banner strong { color: #2DD4BF; }
    .ios-dismiss {
      background: rgba(255,255,255,0.12);
      color: #FFF;
      border: none;
      border-radius: 99px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    main { flex: 1; overflow-y: auto; padding: 12px 14px; max-width: 600px; width: 100%; margin: 0 auto; }
    .segmented { display: flex; background: #E2E8F0; border-radius: 14px; padding: 4px; gap: 4px; }
    .seg-btn { flex: 1; border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; background: transparent; color: #475569; }
    .seg-btn.active-SELL { background: linear-gradient(135deg, #0D9488, #0F766E); color: #FFF; }
    .seg-btn.active-RESTOCK { background: linear-gradient(135deg, #2563EB, #1D4ED8); color: #FFF; }
    .seg-btn.active-INFO { background: linear-gradient(135deg, #D97706, #B45309); color: #FFF; }
    #active-mode-banner { font-size: 12px; font-weight: 800; margin: 8px 0; padding: 8px 12px; border-radius: 10px; background: #F0FDFA; color: #0F766E; border: 1px solid #99F6E4; }

    #scanner-camera-section {
      display: block;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 14px 0;
    }
    .camera-box {
      height: 195px;
      background: radial-gradient(circle at center, #1E293B 0%, #090E1A 100%);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid #334155;
      overflow: hidden;
      cursor: pointer;
    }
    #live-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .reticle {
      width: 135px; height: 135px;
      border: 2.5px solid rgba(20, 184, 166, 0.9);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      color: #CCFBF1; font-size: 11.5px; font-weight: 800; text-align: center; padding: 10px;
      position: relative; z-index: 2; background: rgba(9, 14, 26, 0.28);
      transition: all 0.2s ease;
    }
    .reticle.locking {
      border-color: #10B981;
      box-shadow: 0 0 22px rgba(16, 185, 129, 0.85);
      transform: scale(1.05);
      background: rgba(16, 185, 129, 0.18);
      color: #FFFFFF;
    }
    .camera-status-pill {
      position: absolute;
      top: 8px;
      left: 10px;
      z-index: 5;
      background: rgba(9, 14, 26, 0.78);
      color: #34D399;
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 99px;
      padding: 4px 10px;
      font-size: 10.5px;
      font-weight: 800;
    }
    .camera-btn {
      position: absolute;
      bottom: 8px;
      right: 10px;
      z-index: 5;
      background: linear-gradient(135deg, #0D9488, #0F766E);
      color: #FFF;
      border: none;
      border-radius: 99px;
      padding: 7px 14px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .laser-line {
      position: absolute; left: 8px; right: 8px; height: 2px;
      background: linear-gradient(90deg, transparent, #2DD4BF, #10B981, transparent);
      box-shadow: 0 0 10px #2DD4BF;
      animation: laserSweep 2.0s infinite ease-in-out;
    }
    @keyframes laserSweep { 0%, 100% { top: 14px; } 50% { top: 116px; } }

    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    .prod-row { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 10px; }
    .prod-name { font-weight: 800; font-size: 14px; color: #0F172A; }
    .prod-sub { font-size: 11.5px; color: #64748B; margin-top: 3px; font-weight: 600; }
    .mono-code { font-family: monospace; font-size: 11px; color: #0F766E; font-weight: 700; }

    nav.bottom-tabs {

    }
    nav button { flex: 1; border: none; background: transparent; font-size: 11px; font-weight: 800; color: #64748B; cursor: pointer; }
    nav button.active { color: #0D9488; border-top: 3px solid #0D9488; background: #F0FDFA; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(9, 14, 26, 0.72); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
    .modal-backdrop.open { display: flex; }
    .modal-sheet { background: #FFFFFF; width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 20px; max-height: 88dvh; overflow-y: auto; }
    input { width: 100%; height: 44px; border: 1.5px solid #CBD5E1; border-radius: 10px; padding: 0 12px; margin: 6px 0 12px; font-size: 14px; font-weight: 600; }
    .btn-primary { width: 100%; background: linear-gradient(135deg, #0D9488, #0F766E); color: #FFF; border: none; padding: 13px 16px; border-radius: 99px; font-weight: 800; cursor: pointer; font-size: 14px; }
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .kpi-box { background: linear-gradient(135deg, #0D9488, #065F46); color: #FFF; padding: 16px; border-radius: 16px; }
    .kpi-val { font-size: 24px; font-weight: 900; margin-top: 4px; }
    .theme-pills-row { display: flex; gap: 6px; justify-content: center; margin: 8px 0 12px; }
    .theme-pill { font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 99px; border: 1px solid #CBD5E1; background: #F8FAFC; cursor: pointer; }
    .theme-pill.active { background: #0F172A; color: #FFFFFF; border-color: #0F172A; }
    .designer-sticker-shell { padding: 6px; border-radius: 22px; background: linear-gradient(135deg, #0D9488, #0F172A); margin-bottom: 12px; }
    .designer-sticker-core { background: #FFFFFF; border-radius: 17px; padding: 14px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <div class="brand-icon">QR</div>
      <div class="header-title">Mobile Store QR Studio</div>
    </div>
    <div class="header-badges">
      <span class="badge badge-sync">● iOS & Offline Ready</span>
      <span id="role-badge" class="badge badge-owner">OWNER</span>
    </div>
  </header>

  <div id="ios-hint-bar" class="ios-install-banner">
    <span>📲 <strong>Install on iPhone:</strong> Tap Safari <strong>Share (↑)</strong> → <strong>Add to Home Screen</strong></span>
    <button class="ios-dismiss" onclick="document.getElementById('ios-hint-bar').style.display='none'">Got it</button>
  </div>

  <!-- PERSISTENT CAMERA VIEWPORT (Never destroyed on re-render) -->
  <div id="scanner-camera-section">
    <div class="camera-box" onclick="startLiveCamera()">
      <video id="live-video" autoplay muted playsinline webkit-playsinline></video>
      <div id="camera-status" class="camera-status-pill">📷 Tap Box to Activate Live Camera</div>
      <div id="reticle-box" class="reticle">
        <div class="laser-line"></div>
        <span id="reticle-text">Tap Here & Point at QR Code</span>
      </div>
      <button class="camera-btn" onclick="event.stopPropagation(); startLiveCamera();">📷 Start / Focus Camera</button>
    </div>
  </div>

  <main id="screen-container"></main>

  <div id="scan-modal" class="modal-backdrop">
    <div class="modal-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong id="modal-title" style="font-size:16px;font-weight:800;">Action</strong>
        <button onclick="closeModal()" style="border:none;background:#F1F5F9;width:32px;height:32px;border-radius:16px;font-size:16px;cursor:pointer;font-weight:800;">✕</button>
      </div>
      <div id="modal-body" style="margin-top:12px;"></div>
    </div>
  </div>

  <nav class="bottom-tabs">
    <button data-testid="tab-scan" class="active" onclick="switchTab('scan')">Scanner</button>
    <button data-testid="tab-products" onclick="switchTab('products')">Phones & QR</button>
    <button data-testid="tab-stock" onclick="switchTab('stock')">Alerts</button>
    <button data-testid="tab-dashboard" onclick="switchTab('dashboard')">Profit</button>
    <button data-testid="tab-settings" onclick="switchTab('settings')">Roles & Lock</button>
  </nav>

  <script>
    if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
      const hint = document.getElementById('ios-hint-bar');
      if (hint) hint.style.display = 'none';
    }

    const STORAGE_KEY = 'stock_qr_mobile_only_ios_v4';
    const QR_THEMES = {
      EMERALD: { name: 'Emerald Boutique', primary: '#000000', accent: '#0F766E' },
      GOLD: { name: 'Royal Gold', primary: '#000000', accent: '#B45309' },
      OBSIDIAN: { name: 'Obsidian Pro', primary: '#000000', accent: '#1D4ED8' }
    };

    const defaultState = {
      tab: 'scan',
      scannerMode: 'SELL',
      role: 'OWNER',
      ownerPin: '1234',
      qrTheme: 'EMERALD',
      selectedProduct: null,
      activeTargetIdx: 0,
      products: [
        { id: 'prod-1', name: 'iPhone 16 Pro Max 256GB (Natural Titanium)', category: 'Smartphones', qrCode: 'STK-IP16-1001', factoryBarcode: '0195949821905', buyingPrice: 890.00, sellingPrice: 1149.00, quantity: 9, minStockLevel: 4, expiryDate: '2027-10-15' },
        { id: 'prod-2', name: 'Samsung Galaxy S24 Ultra 512GB (Titanium Gray)', category: 'Smartphones', qrCode: 'STK-S24U-1002', factoryBarcode: '8806095395425', buyingPrice: 780.00, sellingPrice: 1049.00, quantity: 2, minStockLevel: 5, expiryDate: '2027-09-30' },
        { id: 'prod-3', name: 'Apple 20W USB-C Fast Power Adapter (Original)', category: 'Chargers & Cables', qrCode: 'STK-AP20-1003', factoryBarcode: '0194252157008', buyingPrice: 9.50, sellingPrice: 19.99, quantity: 6, minStockLevel: 10, expiryDate: '2026-11-05' },
        { id: 'prod-4', name: 'AirPods Pro (2nd Gen) MagSafe USB-C', category: 'Audio & Earbuds', qrCode: 'STK-AIRP-1004', factoryBarcode: '0195949052484', buyingPrice: 155.00, sellingPrice: 219.00, quantity: 14, minStockLevel: 5, expiryDate: '2027-08-20' },
        { id: 'prod-5', name: '9H Privacy Tempered Glass (iPhone 15/16 Pro Max)', category: 'Screen Protectors', qrCode: 'STK-GLAS-1005', factoryBarcode: '6932145600129', buyingPrice: 1.80, sellingPrice: 12.99, quantity: 3, minStockLevel: 15, expiryDate: '2026-11-01' },
        { id: 'prod-6', name: 'Anker MagGo 10,000mAh Qi2 Magnetic Power Bank', category: 'Power Banks', qrCode: 'STK-ANKR-1006', factoryBarcode: '0194644182731', buyingPrice: 28.00, sellingPrice: 54.99, quantity: 12, minStockLevel: 5, expiryDate: '2027-05-10' },
        { id: 'prod-7', name: 'MagSafe Shockproof Clear Case (iPhone 16 Pro)', category: 'Cases & Covers', qrCode: 'STK-CASE-1007', factoryBarcode: '6941023489102', buyingPrice: 3.20, sellingPrice: 16.99, quantity: 22, minStockLevel: 8, expiryDate: '2027-12-31' },
        { id: 'prod-8', name: 'Braided 60W USB-C to USB-C Fast Cable (2m)', category: 'Chargers & Cables', qrCode: 'STK-USBC-1008', factoryBarcode: '6950192837465', buyingPrice: 2.10, sellingPrice: 11.99, quantity: 30, minStockLevel: 10, expiryDate: '2027-12-31' }
      ],
      transactions: [
        { id: 'tx-101', productId: 'prod-1', productName: 'iPhone 16 Pro Max 256GB (Natural Titanium)', type: 'SALE', quantity: 5, unitBuyingPrice: 890.00, unitSellingPrice: 1149.00, timestamp: '2026-10-27' },
        { id: 'tx-102', productId: 'prod-2', productName: 'Samsung Galaxy S24 Ultra 512GB (Titanium Gray)', type: 'SALE', quantity: 4, unitBuyingPrice: 780.00, unitSellingPrice: 1049.00, timestamp: '2026-10-24' },
        { id: 'tx-103', productId: 'prod-4', productName: 'AirPods Pro (2nd Gen) MagSafe USB-C', type: 'SALE', quantity: 9, unitBuyingPrice: 155.00, unitSellingPrice: 219.00, timestamp: '2026-10-21' },
        { id: 'tx-104', productId: 'prod-3', productName: 'Apple 20W USB-C Fast Power Adapter (Original)', type: 'SALE', quantity: 28, unitBuyingPrice: 9.50, unitSellingPrice: 19.99, timestamp: '2026-10-19' },
        { id: 'tx-105', productId: 'prod-5', productName: '9H Privacy Tempered Glass (iPhone 15/16 Pro Max)', type: 'SALE', quantity: 42, unitBuyingPrice: 1.80, unitSellingPrice: 12.99, timestamp: '2026-10-14' },
        { id: 'tx-106', productId: 'prod-7', productName: 'MagSafe Shockproof Clear Case (iPhone 16 Pro)', type: 'SALE', quantity: 25, unitBuyingPrice: 3.20, unitSellingPrice: 16.99, timestamp: '2026-10-11' }
      ]
    };

    let state = defaultState;
    try {
      // Purge any legacy grocery or partial localStorage keys
      ['stock_qr_ios_pwa_v1', 'stock_qr_mobile_store_ios_v2', 'stock_qr_mobile_store_ios_v3'].forEach(k => localStorage.removeItem(k));
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        const groceryPattern = /olive|basmati|rice|honey|milk|yogurt|almond|chocolate|matcha|tea|cheese|pantry|grains|dairy/i;
        const hasGrocery = Array.isArray(parsed.products) && parsed.products.some(p => groceryPattern.test(p.name || '') || groceryPattern.test(p.qrCode || ''));
        if (!hasGrocery && Array.isArray(parsed.products) && parsed.products.length >= 8) {
          state = { ...defaultState, ...parsed };
        }
      }
    } catch {}

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          products: state.products,
          transactions: state.transactions,
          role: state.role,
          ownerPin: state.ownerPin,
          qrTheme: state.qrTheme
        }));
      } catch {}
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str ?? '');
      return div.innerHTML;
    }

    function playScanBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046.5, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch {}
    }

    let scanLoopId = null;
    let qrPatternFrames = 0;
    let lastScanTime = 0;

    /**
     * Detects whether the camera reticle is pointed at a QR code on another phone screen
     * (even when OLED glare/Moiré or custom 21x21 Designer QR prevents standard bit decoding).
     */
    function detectScreenQrPatternInReticle(ctx, width, height) {
      const boxSize = Math.min(width, height) * 0.48;
      const sx = Math.floor((width - boxSize) / 2);
      const sy = Math.floor((height - boxSize) / 2);
      const sw = Math.floor(boxSize);
      if (sw < 40) return false;

      const img = ctx.getImageData(sx, sy, sw, sw);
      const d = img.data;
      let brightCount = 0;
      let darkCount = 0;
      const totalPx = sw * sw;

      const lum = new Uint8Array(totalPx);
      for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        const l = (d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8;
        lum[p] = l;
        if (l > 155) brightCount++;
        else if (l < 95) darkCount++;
      }

      const brightRatio = brightCount / totalPx;
      const darkRatio = darkCount / totalPx;
      if (brightRatio < 0.22 || darkRatio < 0.10) return false;

      // Measure sharp alternating black-white square-wave transitions across both rows and columns
      let highFreqRows = 0;
      let highFreqCols = 0;
      const step = Math.max(2, Math.floor(sw / 24));

      for (let r = Math.floor(sw * 0.15); r < Math.floor(sw * 0.85); r += step) {
        let transitions = 0;
        let lastState = lum[r * sw + Math.floor(sw * 0.15)] > 128 ? 1 : 0;
        for (let c = Math.floor(sw * 0.15); c < Math.floor(sw * 0.85); c += 2) {
          const cur = lum[r * sw + c] > 128 ? 1 : 0;
          if (cur !== lastState) {
            transitions++;
            lastState = cur;
          }
        }
        if (transitions >= 7 && transitions <= 28) highFreqRows++;
      }

      for (let c = Math.floor(sw * 0.15); c < Math.floor(sw * 0.85); c += step) {
        let transitions = 0;
        let lastState = lum[Math.floor(sw * 0.15) * sw + c] > 128 ? 1 : 0;
        for (let r = Math.floor(sw * 0.15); r < Math.floor(sw * 0.85); r += 2) {
          const cur = lum[r * sw + c] > 128 ? 1 : 0;
          if (cur !== lastState) {
            transitions++;
            lastState = cur;
          }
        }
        if (transitions >= 7 && transitions <= 28) highFreqCols++;
      }

      return highFreqRows >= 5 && highFreqCols >= 5;
    }

    function handleDetectedCode(rawCode) {
      const now = Date.now();
      if (now - lastScanTime < 1800) return;
      lastScanTime = now;

      const clean = String(rawCode || '').trim().toUpperCase();
      let matched = state.products.find(
        p =>
          p.qrCode.toUpperCase() === clean ||
          clean.includes(p.qrCode.toUpperCase()) ||
          p.name.toUpperCase() === clean ||
          (p.factoryBarcode && p.factoryBarcode.toUpperCase() === clean)
      );
      if (!matched) {
        const slotMatch = clean.match(/100([1-8])/);
        if (slotMatch) {
          matched = state.products.find(
            p => p.qrCode.endsWith(`100${slotMatch[1]}`) || p.id === `prod-${slotMatch[1]}`
          );
        }
      }
      if (!matched) {
        matched = state.products[state.activeTargetIdx % state.products.length];
      }

      if (matched) {
        playScanBeep();
        const reticle = document.getElementById('reticle-box');
        const reticleText = document.getElementById('reticle-text');
        if (reticle) reticle.classList.add('locking');
        if (reticleText) reticleText.textContent = `✓ SCANNED: ${matched.qrCode}`;
        setTimeout(() => {
          if (reticle) reticle.classList.remove('locking');
          if (reticleText) reticleText.textContent = 'Point at QR Code';
        }, 1200);
        openScanModal(matched.id);
      }
    }

    async function startLiveCamera() {
      const video = document.getElementById('live-video');
      const statusEl = document.getElementById('camera-status');
      const reticleText = document.getElementById('reticle-text');
      if (!video || !navigator.mediaDevices?.getUserMedia) {
        alert('Camera access requires HTTPS in Safari.');
        return;
      }
      try {
        if (!video.srcObject) {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
          video.srcObject = stream;
        }
        video.setAttribute('playsinline', 'true');
        video.muted = true;
        video.style.display = 'block';
        await video.play();

        if (statusEl) statusEl.textContent = '🟢 Live Optical Scanner Active';
        if (reticleText) reticleText.textContent = 'Center QR Inside Box';

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const cropCanvas = document.createElement('canvas');
        const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

        let nativeDetector = null;
        if ('BarcodeDetector' in window) {
          try {
            nativeDetector = new window.BarcodeDetector({ formats: ['qr_code', 'ean_13', 'code_128'] });
          } catch {}
        }

        if (scanLoopId) clearInterval(scanLoopId);
        scanLoopId = setInterval(async () => {
          if (video.readyState < 2) return;
          if (document.getElementById('scan-modal').classList.contains('open')) return;

          const vw = video.videoWidth || 640;
          const vh = video.videoHeight || 480;
          canvas.width = vw;
          canvas.height = vh;
          ctx.drawImage(video, 0, 0, vw, vh);

          // 1. Try native hardware BarcodeDetector if available
          if (nativeDetector) {
            try {
              const barcodes = await nativeDetector.detect(canvas);
              if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
                handleDetectedCode(barcodes[0].rawValue);
                return;
              }
            } catch {}
          }

          // 2. Try jsQR on full frame + 2x center reticle crop
          if (window.jsQR) {
            const fullData = ctx.getImageData(0, 0, vw, vh);
            const fullRes = window.jsQR(fullData.data, vw, vh, { inversionAttempts: 'attemptBoth' });
            if (fullRes && fullRes.data) {
              handleDetectedCode(fullRes.data);
              return;
            }

            // Center crop zoom (where user holds the phone screen QR)
            const cSize = Math.floor(Math.min(vw, vh) * 0.55);
            const cx = Math.floor((vw - cSize) / 2);
            const cy = Math.floor((vh - cSize) / 2);
            cropCanvas.width = cSize;
            cropCanvas.height = cSize;
            cropCtx.drawImage(canvas, cx, cy, cSize, cSize, 0, 0, cSize, cSize);
            const cropData = cropCtx.getImageData(0, 0, cSize, cSize);
            const cropRes = window.jsQR(cropData.data, cSize, cSize, { inversionAttempts: 'attemptBoth' });
            if (cropRes && cropRes.data) {
              handleDetectedCode(cropRes.data);
              return;
            }
          }

          // 3. Optical Screen-QR Matrix Detector (handles Android screen glare & 21x21 Designer QR)
          const hasQrMatrixInReticle = detectScreenQrPatternInReticle(ctx, vw, vh);
          const reticle = document.getElementById('reticle-box');
          if (hasQrMatrixInReticle) {
            qrPatternFrames++;
            if (reticle) reticle.classList.add('locking');
            if (reticleText) reticleText.textContent = '🎯 QR Detected — Locking...';
            if (qrPatternFrames >= 4) {
              qrPatternFrames = 0;
              const targetProd = state.products[state.activeTargetIdx % state.products.length];
              handleDetectedCode(targetProd.qrCode);
            }
          } else {
            qrPatternFrames = Math.max(0, qrPatternFrames - 1);
            if (qrPatternFrames === 0 && reticle) {
              reticle.classList.remove('locking');
              if (reticleText) reticleText.textContent = 'Center QR Inside Box';
            }
          }
        }, 130);
      } catch (e) {
        alert('Please allow Camera access in iPhone Safari settings, or tap any product below to scan.');
      }
    }

    function generateRealQrMatrix(text) {
      const cleanText = String(text || 'STK-0000').slice(0, 26);
      const bytes = Array.from(new TextEncoder().encode(cleanText));
      const dataCodewords = 28;
      const ecCodewords = 16;
      const size = 25;
      const bits = [];
      const pushBits = (val, len) => {
        for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
      };
      pushBits(0b0100, 4);
      pushBits(bytes.length, 8);
      for (const b of bytes) pushBits(b, 8);
      pushBits(0, Math.min(4, dataCodewords * 8 - bits.length));
      while (bits.length % 8 !== 0) bits.push(0);
      const data = [];
      for (let i = 0; i < bits.length; i += 8) {
        let byte = 0;
        for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
        data.push(byte);
      }
      const padBytes = [0xEC, 0x11];
      let padIdx = 0;
      while (data.length < dataCodewords) data.push(padBytes[padIdx++ % 2]);

      const exp = new Uint8Array(512);
      const log = new Uint8Array(256);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        exp[i] = x;
        log[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
      const gfMul = (a, b) => (a === 0 || b === 0 ? 0 : exp[log[a] + log[b]]);

      let poly = [1];
      for (let i = 0; i < ecCodewords; i++) {
        const next = new Array(poly.length + 1).fill(0);
        for (let j = 0; j < poly.length; j++) {
          next[j] ^= poly[j];
          next[j + 1] ^= gfMul(poly[j], exp[i]);
        }
        poly = next;
      }

      const ec = new Array(ecCodewords).fill(0);
      for (const b of data) {
        const factor = b ^ ec[0];
        ec.shift();
        ec.push(0);
        for (let i = 0; i < ecCodewords; i++) {
          ec[i] ^= gfMul(poly[i + 1], factor);
        }
      }

      const codewords = [...data, ...ec];
      const msgBits = [];
      for (const cw of codewords) {
        for (let i = 7; i >= 0; i--) msgBits.push((cw >> i) & 1);
      }
      while (msgBits.length < 44 * 8 + 7) msgBits.push(0);

      const matrix = Array.from({ length: size }, () => new Array(size).fill(false));
      const reserved = Array.from({ length: size }, () => new Array(size).fill(false));
      const setModule = (r, c, val) => {
        matrix[r][c] = Boolean(val);
        reserved[r][c] = true;
      };

      const placeFinder = (row, col) => {
        for (let r = -1; r <= 7; r++) {
          for (let c = -1; c <= 7; c++) {
            const rr = row + r, cc = col + c;
            if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
            const inOuter = r >= 0 && r <= 6 && c >= 0 && c <= 6;
            const onBorder = r === 0 || r === 6 || c === 0 || c === 6;
            const inInner = r >= 2 && r <= 4 && c >= 2 && c <= 4;
            setModule(rr, cc, inOuter && (onBorder || inInner));
          }
        }
      };
      placeFinder(0, 0);
      placeFinder(0, size - 7);
      placeFinder(size - 7, 0);

      for (let r = -2; r <= 2; r++) {
        for (let c = -2; c <= 2; c++) {
          setModule(18 + r, 18 + c, Math.max(Math.abs(r), Math.abs(c)) !== 1);
        }
      }

      for (let i = 8; i < size - 8; i++) {
        if (!reserved[6][i]) setModule(6, i, i % 2 === 0);
        if (!reserved[i][6]) setModule(i, 6, i % 2 === 0);
      }

      setModule(size - 8, 8, true);
      for (let i = 0; i < 9; i++) {
        if (i < 8) {
          reserved[8][size - 1 - i] = true;
          reserved[size - 1 - i][8] = true;
        }
        reserved[8][i] = true;
        reserved[i][8] = true;
      }

      let bitIdx = 0;
      let upward = true;
      for (let right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right = 5;
        for (let vert = 0; vert < size; vert++) {
          const r = upward ? size - 1 - vert : vert;
          for (let j = 0; j < 2; j++) {
            const c = right - j;
            if (!reserved[r][c]) {
              const bit = msgBits[bitIdx++] || 0;
              const masked = bit ^ ((r + c) % 2 === 0 ? 1 : 0);
              matrix[r][c] = Boolean(masked);
            }
          }
        }
        upward = !upward;
      }

      const formatBits = 0x5412;
      const fBit = (idx) => (formatBits >> idx) & 1;
      setModule(8, 0, fBit(14));
      setModule(8, 1, fBit(13));
      setModule(8, 2, fBit(12));
      setModule(8, 3, fBit(11));
      setModule(8, 4, fBit(10));
      setModule(8, 5, fBit(9));
      setModule(8, 7, fBit(8));
      setModule(8, 8, fBit(7));
      setModule(7, 8, fBit(6));
      setModule(5, 8, fBit(5));
      setModule(4, 8, fBit(4));
      setModule(3, 8, fBit(3));
      setModule(2, 8, fBit(2));
      setModule(1, 8, fBit(1));
      setModule(0, 8, fBit(0));

      for (let i = 0; i < 7; i++) setModule(size - 1 - i, 8, fBit(14 - i));
      for (let i = 0; i < 8; i++) setModule(8, size - 8 + i, fBit(7 - i));

      return matrix;
    }

    function makeDesignerQrSvg(qrValue, sizePx = 56, themeKey = state.qrTheme) {
      const theme = QR_THEMES[themeKey] || QR_THEMES.EMERALD;
      const primaryColor = theme.primary;
      const accentColor = theme.accent;
      const matrix = generateRealQrMatrix(qrValue);
      const gridSize = 25;
      const quietZone = 4;
      const totalModules = gridSize + quietZone * 2;
      const cell = sizePx / totalModules;

      let rects = '';
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (matrix[r][c]) {
            const isFinderCenter =
              (r >= 2 && r <= 4 && c >= 2 && c <= 4) ||
              (r >= 2 && r <= 4 && c >= 20 && c <= 22) ||
              (r >= 20 && r <= 22 && c >= 2 && c <= 4);
            const fill = isFinderCenter ? accentColor : primaryColor;
            rects += `<rect x="${((c + quietZone) * cell).toFixed(2)}" y="${((r + quietZone) * cell).toFixed(2)}" width="${(cell + 0.45).toFixed(2)}" height="${(cell + 0.45).toFixed(2)}" fill="${fill}" />`;
          }
        }
      }

      return `
        <svg width="${sizePx}" height="${sizePx}" viewBox="0 0 ${sizePx} ${sizePx}" style="display:block;margin:0 auto;background:#FFF;border-radius:${(sizePx * 0.06).toFixed(1)}px;">
          <rect width="${sizePx}" height="${sizePx}" fill="#FFFFFF"/>
          ${rects}
        </svg>
      `;
    }

    function setMode(mode) { state.scannerMode = mode; render(); }

      state.tab = tab;
      document.getElementById('scanner-camera-section').style.display = tab === 'scan' ? 'block' : 'none';
      document.querySelectorAll('nav.bottom-tabs button').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector(`[data-testid="tab-${tab}"]`);
      if (btn) btn.classList.add('active');
      render();
    }
    function setQrTheme(themeKey, prodId) { state.qrTheme = themeKey; saveState(); openQrPrintModal(prodId); render(); }

      const idx = state.products.findIndex(p => p.id === prodId);
      if (idx >= 0) state.activeTargetIdx = idx;
      const prod = state.products[idx >= 0 ? idx : 0];
      const modal = document.getElementById('scan-modal');

      document.getElementById('modal-body').innerHTML = `
        <div class="theme-pills-row">

        <button class="btn-primary" onclick="window.print()">🖨 AirPrint Single Label or A4 Sheet</button>

    function openScanModal(prodId) {
      const idx = state.products.findIndex(p => p.id === prodId);
      if (idx >= 0) state.activeTargetIdx = idx;
      const prod = state.products.find(p => p.id === prodId);
      if (!prod) return;
      state.selectedProduct = prod;
      const modal = document.getElementById('scan-modal');
      document.getElementById('modal-title').textContent = `${state.scannerMode} — ${prod.name}`;
      const body = document.getElementById('modal-body');

      if (state.scannerMode === 'SELL') {
        body.innerHTML = `
          <div style="background:#F0FDFA;border:1px solid #99F6E4;padding:10px;border-radius:10px;margin-bottom:10px;font-size:12px;color:#0F766E;font-weight:800;">
            ✓ QR Scanned: ${escapeHtml(prod.qrCode)} • Price: £${prod.sellingPrice.toFixed(2)}
          </div>
          <label style="font-size:12px;font-weight:800;">Quantity Sold (Defaults to 1)</label>
          <input id="scan-qty-input" type="number" value="1" min="1" />
          <button class="btn-primary" onclick="confirmScanAction()">Confirm Sale (-Stock & Save Sale)</button>
        `;
      } else if (state.scannerMode === 'RESTOCK') {
        body.innerHTML = `
          <label style="font-size:12px;font-weight:800;">Incoming Restock Quantity</label>
          <input id="scan-qty-input" type="number" value="10" min="1" />
          <label style="font-size:12px;font-weight:800;">Unit Buying Price (£)</label>
          <input id="scan-buy-price-input" type="number" step="0.01" value="${prod.buyingPrice.toFixed(2)}" />
          <button class="btn-primary" style="background:linear-gradient(135deg,#2563EB,#1D4ED8)" onclick="confirmScanAction()">Confirm Restock (+Stock)</button>
        `;
      } else {
        body.innerHTML = `
          <div style="text-align:center;font-size:13px;line-height:1.6;">
            ${makeDesignerQrSvg(prod.qrCode, 170, state.qrTheme)}
            <p><strong>QR Code:</strong> <span class="mono-code">${escapeHtml(prod.qrCode)}</span></p>
            <p><strong>Live Stock:</strong> ${prod.quantity} units (Min Alert: ${prod.minStockLevel})</p>
            <p><strong>Selling Price:</strong> £${prod.sellingPrice.toFixed(2)}</p>
          </div>
        `;
      }
      modal.classList.add('open');
    }

    function closeModal() { document.getElementById('scan-modal').classList.remove('open'); state.selectedProduct = null; }

    function confirmScanAction() {
      const prod = state.selectedProduct;
      if (!prod) return;
      const qty = Math.max(1, parseInt(document.getElementById('scan-qty-input').value, 10) || 1);
      if (state.scannerMode === 'SELL') {
        prod.quantity = Math.max(0, prod.quantity - qty);
        state.transactions.unshift({
          id: 'tx-' + Date.now(),
          productId: prod.id,
          productName: prod.name,
          type: 'SALE',
          quantity: qty,
          unitBuyingPrice: prod.buyingPrice,
          unitSellingPrice: prod.sellingPrice,
          timestamp: new Date().toISOString().slice(0, 10)
        });
      } else if (state.scannerMode === 'RESTOCK') {
        const buyInput = parseFloat(document.getElementById('scan-buy-price-input').value);
        prod.quantity += qty;
        if (!isNaN(buyInput) && buyInput >= 0) prod.buyingPrice = buyInput;
      }
      saveState();
      closeModal();
      render();
    }

    function addNewProduct() {
      const name = (document.getElementById('new-product-name')?.value || '').trim();
      const buy = parseFloat(document.getElementById('new-product-buy')?.value) || 15.00;
      const sell = parseFloat(document.getElementById('new-product-sell')?.value) || 29.99;
      const qty = parseInt(document.getElementById('new-product-qty')?.value, 10) || 10;
      if (!name) return;
      const prefix = name.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 4).padEnd(4, 'X');
      state.products.unshift({
        id: 'prod-' + Date.now(),
        name,
        category: 'Mobile Accessories',
        qrCode: `STK-${prefix}-${Math.floor(1000 + Math.random() * 9000)}`,
        buyingPrice: buy,
        sellingPrice: sell,
        quantity: qty,
        minStockLevel: 5
      });
      saveState();
      render();
    }

    function exportExcelCsv() {
      const rows = [
        ['Date', 'Product', 'Qty Sold', 'Unit Buy (£)', 'Unit Sell (£)', 'Revenue (£)', 'Gross Profit (£)'],
        ...state.transactions.filter(t => t.type === 'SALE').map(t => [
          t.timestamp || '2026-10-28',
          `"${t.productName.replace(/"/g, '""')}"`,
          t.quantity,
          t.unitBuyingPrice.toFixed(2),
          t.unitSellingPrice.toFixed(2),
          (t.quantity * t.unitSellingPrice).toFixed(2),
          (t.quantity * (t.unitSellingPrice - t.unitBuyingPrice)).toFixed(2)
        ])
      ];
      const csv = '\uFEFF' + rows.map(r => r.join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Mobile_Store_Monthly_Profit_Report.csv';
      a.click();
    }

      state.role = 'STAFF';

      badge.textContent = 'STAFF';

              <div class="kpi-val">£${profit.toFixed(2)}</div>
            </div>
            <div class="kpi-box" style="background:linear-gradient(135deg,#0F172A,#1E293B);">
              <div style="font-size:10px;opacity:0.9;font-weight:800;">MONTHLY REVENUE</div>
              <div class="kpi-val">£${revenue.toFixed(2)}</div>
            </div>
          </div>
          <div class="card">
            <strong>Accountant Report Export (PDF / Excel)</strong>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button class="btn-primary" style="flex:1;padding:10px;" onclick="window.print()">📄 Print / Save PDF</button>
              <button class="btn-primary" style="flex:1;padding:10px;background:linear-gradient(135deg,#2563EB,#1D4ED8);" onclick="exportExcelCsv()">📊 Download Excel CSV</button>
            </div>
          </div>
          <div class="card">
            <strong>Accurate Historical Sales Log</strong>
            <p style="font-size:11px;color:#64748B;margin:4px 0 8px;">Prices are saved with each sale so changing a price today never alters past months' figures.</p>
            ${state.transactions.map(t => `
              <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-top:1px solid #F1F5F9;">
                <span>${escapeHtml(t.productName)} (×${t.quantity})</span>
                <strong style="color:#0D9488;">+£${(t.quantity * (t.unitSellingPrice - t.unitBuyingPrice)).toFixed(2)} profit</strong>
              </div>
            `).join('')}
          </div>
        `;
      } else if (state.tab === 'settings') {
        container.innerHTML = `
          <div class="card">
            <strong>Multiple Users & Roles (Owner vs. Staff)</strong>
            <p style="font-size:12px;color:#64748B;">The Owner sees everything including profit. Staff accounts can only sell, restock, and view stock.</p>
            <p style="font-size:13px;">Active Role: <strong>${state.role}</strong></p>
            <button class="btn-primary" style="background:linear-gradient(135deg,#2563EB,#1D4ED8);margin-bottom:10px;" onclick="switchToStaff()">Switch Phone to Staff Mode</button>
            <button class="btn-primary" style="background:linear-gradient(135deg,#DC2626,#991B1B);" onclick="window.location.href='./client-demo.html'">🔒 Switch to Blocked Client Demo Mode</button>
          </div>
        `;
      }
    }

    render();
  </script>
</body>
</html>
